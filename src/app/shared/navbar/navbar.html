<nav class="bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">

      <!-- IZQUIERDA -->
      <div class="flex items-center space-x-8">

        <!-- Logo -->
        <a routerLink="/" 
           class="text-xl font-bold text-gray-800 dark:text-gray-200">
          Change
        </a>

        <!-- Links -->
        <div class="hidden sm:flex space-x-6 text-sm font-medium">

          <a routerLink="/peticiones"
             class="text-gray-600 hover:text-gray-900 transition">
            Ver Peticiones
          </a>

          @if (isLoggedIn()) {
            <a routerLink="/peticiones/create"
               class="text-gray-600 hover:text-gray-900 transition">
              Iniciar una petición
            </a>

            <a routerLink="/mispeticiones"
               class="text-gray-600 hover:text-gray-900 transition">
              Mis peticiones
            </a>
          }

        </div>
      </div>

      <!-- BUSCADOR -->
      <form (submit)="buscar($event)" class="hidden sm:flex items-center">
        <div class="relative">
          <input
            type="text"
            [(ngModel)]="searchQuery"
            name="q"
            placeholder="Buscar peticiones..."
            class="w-56 pl-9 pr-3 py-1.5 text-sm border border-gray-300 rounded-full bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition"
          />
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </div>
      </form>

      <!-- DERECHA -->
      <div class="flex items-center space-x-4 text-sm">

        @if (isLoggedIn()) {

          <span class="text-gray-500">
            Hola, {{ currentUser()?.name }} 👋
          </span>

          <a routerLink="/profile"
             class="text-gray-600 hover:text-gray-900 transition">
            Perfil
          </a>

          <button type="button"
                  (click)="logout()"
                  class="px-3 py-1 rounded-md bg-red-500 text-white hover:bg-red-600 transition">
            Salir
          </button>

        } @else {

          <a routerLink="/login"
             class="text-gray-600 hover:text-gray-900 transition">
            Entrar
          </a>

          <a routerLink="/register"
             class="px-3 py-1 rounded-md bg-yellow-400 text-black hover:bg-yellow-500 transition">
            Registrarse
          </a>

        }

      </div>
    </div>
  </div>
</nav>
