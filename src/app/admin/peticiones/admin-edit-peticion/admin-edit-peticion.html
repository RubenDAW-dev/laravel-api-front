<div class="admin-section">
  <a [routerLink]="['/admin/peticiones', peticionId()]" class="back-link">← Volver</a>
  <h1>Editar Petición #{{ peticionId() }}</h1>

  @if (cargando()) {
    <div class="loading">Cargando...</div>
  } @else {
    <div class="form-card">
      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Título</label>
          <input formControlName="titulo" type="text" />
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea formControlName="descripcion" rows="5"></textarea>
        </div>

        <div class="form-group">
          <label>Destinatario</label>
          <input formControlName="destinatario" type="text" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Categoría</label>
            <select formControlName="categoria_id">
              <option value="">— Seleccionar —</option>
              @for (c of categorias(); track c.id) {
                <option [value]="c.id">{{ c.nombre }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>Estado</label>
            <select formControlName="estado">
              <option value="activa">Activa</option>
              <option value="cerrada">Cerrada</option>
              <option value="pendiente">Pendiente</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Imagen</label>
          @if (previewUrl()) {
            <img [src]="previewUrl()" class="preview-img" alt="preview" />
          }
          <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        </div>

        <div class="form-actions">
          <a [routerLink]="['/admin/peticiones', peticionId()]" class="btn-cancel">Cancelar</a>
          <button type="submit" [disabled]="guardando() || form.invalid" class="btn-save">
            {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
          </button>
        </div>
      </form>
    </div>
  }
</div>
