<div class="admin-section">
  <a routerLink="/admin/peticiones" class="back-link">← Volver</a>
  <h1>Nueva Petición</h1>

  <div class="form-card">
    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Título</label>
        <input formControlName="titulo" type="text" placeholder="Título de la petición" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea formControlName="descripcion" rows="5" placeholder="Describe la petición..."></textarea>
      </div>

      <div class="form-group">
        <label>Destinatario</label>
        <input formControlName="destinatario" type="text" placeholder="A quién va dirigida" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Categoría</label>
          <select formControlName="categoria_id">
            <option value="">— Seleccionar —</option>
            @for (c of categorias(); track c.id) {
              <option [value]="c.id">{{ c.nombre }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select formControlName="estado">
            <option value="pendiente">Pendiente</option>
            <option value="aceptada">Aceptada</option>
            <option value="rechazada">Rechazada</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Autor</label>
        <select formControlName="user_id">
          <option value="">— Seleccionar usuario —</option>
          @for (u of users(); track u.id) {
            <option [value]="u.id">{{ u.name }} ({{ u.email }})</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Imagen <span class="optional">(opcional)</span></label>
        @if (previewUrl()) {
          <img [src]="previewUrl()" class="preview-img" alt="preview" />
        }
        <input type="file" accept="image/*,application/pdf" (change)="onFileSelected($event)" />
      </div>

      <div class="form-actions">
        <a routerLink="/admin/peticiones" class="btn-cancel">Cancelar</a>
        <button type="submit" [disabled]="guardando() || form.invalid" class="btn-save">
          {{ guardando() ? 'Creando...' : 'Crear petición' }}
        </button>
      </div>
    </form>
  </div>
</div>
