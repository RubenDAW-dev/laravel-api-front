<div class="admin-section">
  <a [routerLink]="['/admin/users', userId()]" class="back-link">← Volver</a>
  <h1>Editar Usuario #{{ userId() }}</h1>

  @if (cargando()) {
    <div class="loading">Cargando...</div>
  } @else {
    <div class="form-card">
      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Nombre</label>
          <input formControlName="name" type="text" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input formControlName="email" type="email" />
        </div>

        <div class="form-group">
          <label>Rol</label>
          <select formControlName="role">
            <option value="user">Usuario</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nueva contraseña <span class="optional">(opcional)</span></label>
          <input formControlName="password" type="password" placeholder="Dejar en blanco para no cambiar" />
        </div>

        <div class="form-actions">
          <a [routerLink]="['/admin/users', userId()]" class="btn-cancel">Cancelar</a>
          <button type="submit" [disabled]="guardando() || form.invalid" class="btn-save">
            {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
          </button>
        </div>
      </form>
    </div>
  }
</div>
