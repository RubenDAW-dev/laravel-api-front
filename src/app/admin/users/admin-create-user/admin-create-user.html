<div class="admin-section">
  <a routerLink="/admin/users" class="back-link">← Volver</a>
  <h1>Nuevo Usuario</h1>

  <div class="form-card">
    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Nombre</label>
        <input formControlName="name" type="text" placeholder="Nombre completo" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="correo@ejemplo.com" />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input formControlName="password" type="password" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-group">
        <label>Rol</label>
        <select formControlName="role">
          <option value="user">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <div class="form-actions">
        <a routerLink="/admin/users" class="btn-cancel">Cancelar</a>
        <button type="submit" [disabled]="guardando() || form.invalid" class="btn-save">
          {{ guardando() ? 'Creando...' : 'Crear usuario' }}
        </button>
      </div>
    </form>
  </div>
</div>
